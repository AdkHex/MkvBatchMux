name: CI

# A push to main runs these checks as the first job of the release (release.yml),
# so they are not triggered by the push a second time here.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
