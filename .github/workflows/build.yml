name: Build installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.setsha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Bump version
        id: bump
        if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          node scripts/bump-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version [skip ci]"
          # Two pushes landing close together race here: the second run's push
          # is rejected because main moved under it, which fails the whole
          # workflow and publishes no release. Rebase and retry instead.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $i); rebasing onto origin/main and retrying."
            git pull --rebase origin main || exit 1
          done
          echo "Could not push the version bump after 3 attempts."
          exit 1
      - name: Set sha output
        id: setsha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci


      # Delay measurement needs the AudioSync engine and ffmpeg/ffprobe. Both
      # are build artifacts rather than source, so they are produced here and
      # bundled into the installer -- otherwise a fresh install silently ships
      # with the feature disabled, which is exactly what these steps prevent.
      - name: Setup Python (for the analysis engine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out AudioSyncMaster
        uses: actions/checkout@v4
        with:
          repository: AdkHex/AudioSyncMaster
          path: AudioSyncMaster

      - name: Build the analysis engine
        shell: bash
        env:
          AUDIOSYNC_REPO: ${{ github.workspace }}/AudioSyncMaster
        run: |
          python -m pip install --upgrade pip pyinstaller
          # requirements-dev.txt is what AudioSyncMaster's own release workflow
          # installs; the runtime file alone misses what PyInstaller needs to
          # trace imports correctly.
          for req in requirements-dev.txt requirements.txt; do
            if [ -f "$AUDIOSYNC_REPO/python/$req" ]; then
              python -m pip install -r "$AUDIOSYNC_REPO/python/$req"
            fi
          done
          npm run fetch-engine

      - name: Fetch FFmpeg
        run: npm run fetch-ffmpeg

      # fetch-engine and fetch-ffmpeg both exit non-zero on failure, so reaching
      # here means the files exist; this asserts they are where the bundler will
      # look for them before we spend time on a full release build.
      - name: Verify bundled dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; else EXT=""; fi
          for f in "src-tauri/resources/ffmpeg/ffmpeg$EXT" "src-tauri/resources/ffmpeg/ffprobe$EXT"; do
            [ -f "$f" ] || { echo "::error::Missing $f — the installer would ship without delay measurement."; exit 1; }
          done
          if ! find src-tauri/resources/engine -type f -name "audiosync-cli*" | grep -q .; then
            echo "::error::No audiosync-cli binary in src-tauri/resources/engine."
            exit 1
          fi
          echo "Bundled dependencies present."

      - name: Build Tauri (Windows .exe installer + updater)
        if: startsWith(matrix.os, 'windows')
        # NSIS rather than WiX, so the release is a .exe installer. FFmpeg and
        # the analysis engine are bundled as resources above; MKVToolNix and
        # MediaInfo are installed from the app's Settings panel on first run.
        # The updater bundle is that installer plus a detached signature.
        # Signing needs the private key: without these secrets the build still
        # succeeds but produces no .sig, and installed apps reject the update.
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        # Space-separated, and --bundles last: as a multi-value flag it would
        # otherwise swallow any argument that followed it. The comma form
        # silently skipped the bundler entirely on 1.6.3, producing a release
        # with a bare .exe and no installer.
        run: npm run tauri:build -- --bundles nsis updater

      - name: Inspect bundle output
        shell: powershell
        run: |
          # Recursive: the bundler's output directory moved between Tauri
          # versions (bundle/nsis vs a top-level nsis), and a listing of a
          # fixed path that no longer exists explains nothing.
          Write-Host "== installers and updater bundles under target/release =="
          Get-ChildItem -Path "src-tauri/target/release" -Include "*-setup.exe","*.zip","*.sig" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Collect bundles
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Searched from target/release rather than a fixed subdirectory: the
          # bundler emits to bundle/nsis on some versions and a top-level nsis
          # on others, and pinning the wrong one fails a build that succeeded.
          # *-setup.exe also distinguishes the installer from the app's own exe.
          $setup = Get-ChildItem -Path "src-tauri/target/release" -Filter "*-setup.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($setup) { $setup | Copy-Item -Destination artifacts -Force }
          # The updater bundle: the archive the app downloads, plus its signature.
          $upd = Get-ChildItem -Path "src-tauri/target/release" -Include "*-setup.exe.zip","*-setup.exe.zip.sig" -Recurse -ErrorAction SilentlyContinue
          if ($upd) { $upd | Copy-Item -Destination artifacts -Force }
          # A bare .exe is not a release. The bundler silently doing nothing
          # previously produced a green build whose release had no installer at
          # all, so the installer is checked for explicitly rather than
          # accepting whatever happened to land in the directory.
          if (-not $setup) {
            Write-Error "No -setup.exe produced. The bundler did not run -- check the --bundles arguments."
            exit 1
          }
          if (-not $upd) {
            Write-Error "No updater bundle (-setup.exe.zip + .sig) produced, so auto-update would silently break. Check that TAURI_PRIVATE_KEY is set and 'updater' is in --bundles."
            exit 1
          }
          Get-ChildItem -Path artifacts | Select-Object Name, Length | Format-Table

      - name: Build updater manifest
        id: manifest
        shell: powershell
        # latest.json is what an installed app polls. It must carry the version,
        # the download URL and the signature; a manifest without a matching .sig
        # is worse than none, because the app will fetch and then reject it.
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-build.${{ github.run_number }}"
          # Exported so the release step reuses this exact tag. Deriving the
          # same string twice invites a mismatch, and a manifest whose URL
          # points at a tag that was never created is a silent 404 at update
          # time -- the app finds an update it can never download.
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $zip = Get-ChildItem -Path artifacts -Filter "*-setup.exe.zip" | Select-Object -First 1
          $sigFile = Get-ChildItem -Path artifacts -Filter "*-setup.exe.zip.sig" | Select-Object -First 1

          # Collect bundles already fails the build if these are missing, so
          # reaching here without them means that check regressed.
          if (-not $zip -or -not $sigFile) {
            Write-Error "Updater bundle missing after Collect bundles verified it. This should be unreachable."
            exit 1
          }

          $signature = Get-Content $sigFile.FullName -Raw

          # GitHub rewrites spaces in asset names to dots on upload, so the
          # local filename is not the published one. Building the URL from the
          # raw name yields a link that 404s at update time -- the app finds an
          # update it can never download.
          $assetName = $zip.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"

          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated build from commit ${{ github.sha }}."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url       = $url
              }
            }
          }

          # Written without a BOM: PowerShell's -Encoding utf8 emits one on
          # Windows PowerShell, and serde_json rejects a leading BOM, so the
          # updater fails to parse the manifest before it ever sees a version.
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/latest.json"),
            $json,
            (New-Object System.Text.UTF8Encoding $false)
          )
          Write-Host "== latest.json =="
          Get-Content artifacts/latest.json
          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.os }}
          path: artifacts/**
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Same tag the updater manifest points at; see "Build updater manifest".
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: MKVBatchMux v${{ steps.manifest.outputs.version }} (build ${{ github.run_number }})
          # Installed apps resolve the manifest through /releases/latest/, which
          # skips prereleases and drafts -- so this must publish as the latest
          # release or no update is ever offered.
          prerelease: false
          draft: false
          make_latest: "true"
          body: |
            Automated build from commit ${{ github.sha }}.
            Artifacts: Windows .exe installer.

            Installed apps update to this build automatically.
          files: artifacts/**

      - name: Verify the published update is reachable
        shell: powershell
        # The manifest has been wrong twice in ways a green build hid: a URL
        # built from the local filename (GitHub rewrites spaces to dots) and a
        # BOM that made it unparseable. Both only surfaced when an installed
        # app tried to update. Fetching what the app fetches catches it here.
        run: |
          $expected = "${{ steps.manifest.outputs.version }}"
          $endpoint = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

          # GitHub's /releases/latest/ pointer lags the release by a few
          # seconds, so an immediate fetch returns the *previous* manifest and
          # the check fails against a build that was actually fine. Poll until
          # the version matches rather than sleeping a guessed interval.
          $manifest = $null
          foreach ($attempt in 1..10) {
            # .Content can come back as a byte array rather than a string, in
            # which case indexing it yields a byte and every field parses as
            # empty. Decode explicitly so the BOM check tests characters.
            $response = Invoke-WebRequest -Uri $endpoint -UseBasicParsing
            $raw = if ($response.Content -is [byte[]]) {
              [System.Text.Encoding]::UTF8.GetString($response.Content)
            } else {
              [string]$response.Content
            }

            if ($raw.Length -gt 0 -and $raw[0] -eq [char]0xFEFF) {
              Write-Error "latest.json starts with a BOM; the updater cannot parse it."
              exit 1
            }

            # Fail loudly on a body that is not the manifest at all, rather
            # than letting ConvertFrom-Json yield empty fields that read as a
            # stale release and burn every retry.
            if ($raw -notmatch '"version"') {
              Write-Host "Attempt ${attempt}: response did not look like the manifest. First 200 chars:"
              Write-Host $raw.Substring(0, [Math]::Min(200, $raw.Length))
              Start-Sleep -Seconds 6
              continue
            }

            $candidate = $raw | ConvertFrom-Json
            if ($candidate.version -eq $expected) { $manifest = $candidate; break }
            Write-Host "Attempt ${attempt}: served version '$($candidate.version)', waiting for '$expected'."
            Start-Sleep -Seconds 6
          }

          if (-not $manifest) {
            Write-Error "The published manifest never advanced to $expected."
            exit 1
          }
          Write-Host "Published version: $($manifest.version)"

          $url = $manifest.platforms.'windows-x86_64'.url
          Write-Host "Update URL: $url"
          $status = (Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing).StatusCode
          if ($status -ne 200) {
            Write-Error "The update download URL returned $status."
            exit 1
          }
          if (-not $manifest.platforms.'windows-x86_64'.signature) {
            Write-Error "The manifest carries no signature; the app would reject this update."
            exit 1
          }
          Write-Host "Update manifest verified: reachable, signed, parseable."
