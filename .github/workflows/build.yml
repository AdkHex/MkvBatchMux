name: Build installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.setsha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Bump version
        id: bump
        if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          node scripts/bump-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version [skip ci]"
          # Two pushes landing close together race here: the second run's push
          # is rejected because main moved under it, which fails the whole
          # workflow and publishes no release. Rebase and retry instead.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $i); rebasing onto origin/main and retrying."
            git pull --rebase origin main || exit 1
          done
          echo "Could not push the version bump after 3 attempts."
          exit 1
      - name: Set sha output
        id: setsha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: ${{ matrix.os }}
    # A healthy run finishes in about ten minutes. Without a cap a hung
    # bundler sat for fifty before the runner gave up, which wastes an hour
    # and reports the same red tick as a real failure.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          # Release notes are the commit subjects since the previous release,
          # so the build needs the history between the two tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci


      # Delay measurement needs the AudioSync engine and ffmpeg/ffprobe. Both
      # are build artifacts rather than source, so they are produced here and
      # bundled into the installer -- otherwise a fresh install silently ships
      # with the feature disabled, which is exactly what these steps prevent.
      - name: Setup Python (for the analysis engine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The engine is pinned to the AudioSyncMaster *release* the AudioSyncMaster
      # app ships (package.json: audiosyncEngine.ref), never to its main branch.
      # Checking out main here once bundled an unreleased engine rewrite that
      # had landed thirteen minutes earlier, and the two apps then reported
      # different delays for the same files -- cuts and drift flagged on
      # material the released engine measured cleanly -- with nothing in
      # either app to say why. Moving to a newer engine is a deliberate bump
      # of that pin, made in a commit, when AudioSyncMaster has released it.
      - name: Resolve the pinned analysis engine
        id: engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(node -p "require('./package.json').audiosyncEngine.ref")
          repo=$(node -p "require('./package.json').audiosyncEngine.repository")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Engine pinned to $repo@$ref"
          # Not a failure: the pin is meant to lag until both apps move
          # together. But it should never lag silently.
          latest=$(gh release view --repo "$repo" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$ref" ]; then
            echo "::warning title=Engine pin behind::$repo's latest release is $latest but this build pins $ref. Bump audiosyncEngine.ref in package.json when both apps should move to it."
          fi

      - name: Check out AudioSyncMaster
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.ref }}
          path: AudioSyncMaster
          # fetch-engine verifies the checkout against the pinned tag and
          # stamps the build with `git describe`; both need the tags present.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch FFmpeg
        run: npm run fetch-ffmpeg

      - name: Build the analysis engine
        shell: bash
        env:
          AUDIOSYNC_REPO: ${{ github.workspace }}/AudioSyncMaster
        run: |
          python -m pip install --upgrade pip pyinstaller
          # requirements-dev.txt is what AudioSyncMaster's own release workflow
          # installs; the runtime file alone misses what PyInstaller needs to
          # trace imports correctly.
          for req in requirements-dev.txt requirements.txt; do
            if [ -f "$AUDIOSYNC_REPO/python/$req" ]; then
              python -m pip install -r "$AUDIOSYNC_REPO/python/$req"
            fi
          done
          npm run fetch-engine

      # Mirrors the smoke test in AudioSyncMaster's own release workflow: an
      # engine that starts but computes garbage is invisible until a user
      # presses Measure. The stamp check is what this pipeline was missing --
      # it is the one line that would have said "this is not v2.8.0".
      - name: Verify the bundled engine is the pinned release and measures correctly
        shell: bash
        env:
          AUDIOSYNC_REPO: ${{ github.workspace }}/AudioSyncMaster
          PINNED: ${{ steps.engine.outputs.ref }}
        run: |
          set -euo pipefail
          stamp=$(cat src-tauri/resources/engine/ENGINE_VERSION)
          echo "Bundled engine: $stamp"
          case "$stamp" in
            "AudioSyncMaster $PINNED ("*) ;;
            *) echo "::error::The bundled engine is '$stamp', not the pinned $PINNED."; exit 1 ;;
          esac

          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; else EXT=""; fi
          ENGINE=""
          for candidate in "src-tauri/resources/engine/audiosync-cli$EXT" \
                           "src-tauri/resources/engine/audiosync-cli/audiosync-cli$EXT"; do
            [ -f "$candidate" ] && ENGINE="$PWD/$candidate" && break
          done
          [ -n "$ENGINE" ] || { echo "::error::No audiosync-cli binary to smoke-test."; exit 1; }
          # The engine shells out to ffmpeg by name, exactly as the installed
          # app will make it do; the runner image has none of its own.
          export PATH="$PWD/src-tauri/resources/ffmpeg:$PATH"
          (cd "$AUDIOSYNC_REPO" && python tests/make_fixtures.py)
          # The same request shape the app sends: explicit pairs, upstream's
          # default window settings. Built by Python rather than printf because
          # the Windows workspace path contains backslashes, which are not
          # valid JSON escapes.
          python - "$ENGINE" "$AUDIOSYNC_REPO" <<'CHECK'
          import json, os, subprocess, sys
          engine, repo = sys.argv[1], sys.argv[2]
          fixture = lambda name: os.path.join(repo, "tests", "fixtures", name)
          request = {
              "command": "analyze",
              "pairs": [{
                  "primaryPath": fixture("offset_500ms_primary.wav"),
                  "secondaryPath": fixture("offset_500ms_secondary.wav"),
                  "key": "smoke", "method": "mkvbatchmux", "score": 1,
                  "primaryTrack": 0, "secondaryTrack": 0,
              }],
              "windowSeconds": 8, "windowCount": 3, "maxOffsetMs": 60000, "maxWorkers": 1,
          }
          out = subprocess.run(
              [engine], input=json.dumps(request) + "\n" + json.dumps({"command": "shutdown"}) + "\n",
              capture_output=True, text=True, timeout=300,
          )
          delay = None
          for line in out.stdout.splitlines():
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get("type") == "result":
                  delay = event.get("delayMs")
          if delay is None or abs(delay - 500.0) > 5.0:
              sys.stderr.write(out.stderr)
              raise SystemExit(f"engine measured {delay!r} ms for a 500 ms fixture")
          print(f"engine measured {delay:.2f} ms for a 500 ms fixture")
          CHECK

      # fetch-engine and fetch-ffmpeg both exit non-zero on failure, so reaching
      # here means the files exist; this asserts they are where the bundler will
      # look for them before we spend time on a full release build.
      - name: Verify bundled dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; else EXT=""; fi
          for f in "src-tauri/resources/ffmpeg/ffmpeg$EXT" "src-tauri/resources/ffmpeg/ffprobe$EXT"; do
            [ -f "$f" ] || { echo "::error::Missing $f — the installer would ship without delay measurement."; exit 1; }
          done
          if ! find src-tauri/resources/engine -type f -name "audiosync-cli*" | grep -q .; then
            echo "::error::No audiosync-cli binary in src-tauri/resources/engine."
            exit 1
          fi
          echo "Bundled dependencies present."

      - name: Build Tauri (Windows .exe installer + updater)
        if: startsWith(matrix.os, 'windows')
        # NSIS rather than WiX, so the release is a .exe installer. FFmpeg and
        # the analysis engine are bundled as resources above; MKVToolNix and
        # MediaInfo are installed from the app's Settings panel on first run.
        # The updater bundle is that installer plus a detached signature.
        # Signing needs the private key: without these secrets the build still
        # succeeds but produces no .sig, and installed apps reject the update.
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        # Space-separated, and --bundles last: as a multi-value flag it would
        # otherwise swallow any argument that followed it. The comma form
        # silently skipped the bundler entirely on 1.6.3, producing a release
        # with a bare .exe and no installer.
        # Tighter than the job cap so a hang here is attributed to the
        # bundler rather than to whatever step happened to be running.
        timeout-minutes: 20
        run: npm run tauri:build -- --bundles nsis updater

      - name: Inspect bundle output
        shell: powershell
        run: |
          # Recursive: the bundler's output directory moved between Tauri
          # versions (bundle/nsis vs a top-level nsis), and a listing of a
          # fixed path that no longer exists explains nothing.
          Write-Host "== installers and updater bundles under target/release =="
          Get-ChildItem -Path "src-tauri/target/release" -Include "*-setup.exe","*.zip","*.sig" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Collect bundles
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Searched from target/release rather than a fixed subdirectory: the
          # bundler emits to bundle/nsis on some versions and a top-level nsis
          # on others, and pinning the wrong one fails a build that succeeded.
          # *-setup.exe also distinguishes the installer from the app's own exe.
          $setup = Get-ChildItem -Path "src-tauri/target/release" -Filter "*-setup.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($setup) { $setup | Copy-Item -Destination artifacts -Force }
          # The updater bundle: the archive the app downloads, plus its signature.
          $upd = Get-ChildItem -Path "src-tauri/target/release" -Include "*-setup.nsis.zip","*-setup.nsis.zip.sig" -Recurse -ErrorAction SilentlyContinue
          if ($upd) { $upd | Copy-Item -Destination artifacts -Force }
          # A bare .exe is not a release. The bundler silently doing nothing
          # previously produced a green build whose release had no installer at
          # all, so the installer is checked for explicitly rather than
          # accepting whatever happened to land in the directory.
          if (-not $setup) {
            Write-Error "No -setup.exe produced. The bundler did not run -- check the --bundles arguments."
            exit 1
          }
          if (-not $upd) {
            Write-Error "No updater bundle (-setup.nsis.zip + .sig) produced, so auto-update would silently break. Check that TAURI_PRIVATE_KEY is set and 'updater' is in --bundles."
            exit 1
          }
          Get-ChildItem -Path artifacts | Select-Object Name, Length | Format-Table

      - name: Build updater manifest
        id: manifest
        shell: powershell
        # latest.json is what an installed app polls. It must carry the version,
        # the download URL and the signature; a manifest without a matching .sig
        # is worse than none, because the app will fetch and then reject it.
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-build.${{ github.run_number }}"
          # Exported so the release step reuses this exact tag. Deriving the
          # same string twice invites a mismatch, and a manifest whose URL
          # points at a tag that was never created is a silent 404 at update
          # time -- the app finds an update it can never download.
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $zip = Get-ChildItem -Path artifacts -Filter "*-setup.nsis.zip" | Select-Object -First 1
          $sigFile = Get-ChildItem -Path artifacts -Filter "*-setup.nsis.zip.sig" | Select-Object -First 1

          # Collect bundles already fails the build if these are missing, so
          # reaching here without them means that check regressed.
          if (-not $zip -or -not $sigFile) {
            Write-Error "Updater bundle missing after Collect bundles verified it. This should be unreachable."
            exit 1
          }

          $signature = Get-Content $sigFile.FullName -Raw

          # GitHub rewrites spaces in asset names to dots on upload, so the
          # local filename is not the published one. Building the URL from the
          # raw name yields a link that 404s at update time -- the app finds an
          # update it can never download.
          $assetName = $zip.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"

          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated build from commit ${{ github.sha }}."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url       = $url
              }
            }
          }

          # Written without a BOM: PowerShell's -Encoding utf8 emits one on
          # Windows PowerShell, and serde_json rejects a leading BOM, so the
          # updater fails to parse the manifest before it ever sees a version.
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/latest.json"),
            $json,
            (New-Object System.Text.UTF8Encoding $false)
          )
          Write-Host "== latest.json =="
          Get-Content artifacts/latest.json
          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.os }}
          path: artifacts/**
          if-no-files-found: error

      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        # "Automated build from commit <sha>" told a user nothing about what
        # changed. Commit subjects are written as behaviour changes, so the list
        # of them since the previous release *is* the changelog. The installer's
        # SHA-256 is published alongside because the installer is not
        # code-signed: it is the one way a user can check the download.
        run: |
          set -euo pipefail
          prev=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "## MKVBatchMux v$VERSION"
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              changes=$(git log --no-merges --pretty='- %s' "$prev..HEAD" \
                | grep -v -e 'chore: bump version' -e '^- Update project files$' -e '^- [Uu]pdated\?$' || true)
              if [ -n "$changes" ]; then
                echo "### Changes since $prev"
                echo "$changes"
              elif [ "$(git rev-list --count --no-merges "$prev..HEAD")" -gt 0 ]; then
                echo "Maintenance changes since $prev; nothing user-facing to list."
              else
                echo "Rebuild of $prev with no source changes."
              fi
            else
              echo "Changes: see the commit history up to ${{ github.sha }}."
            fi
            echo
            echo "### Downloads"
            echo
            echo '| File | SHA-256 |'
            echo '|---|---|'
            for f in artifacts/*-setup.exe artifacts/*-setup.nsis.zip; do
              [ -f "$f" ] || continue
              printf '| `%s` | `%s` |\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "Windows only. The installer is not code-signed yet, so SmartScreen will warn on first run: choose **More info → Run anyway**, or verify the SHA-256 above first."
            echo
            echo "Installed apps update to this build automatically. Built from ${{ github.sha }}."
          } > release-notes.md
          echo "== release-notes.md =="
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Same tag the updater manifest points at; see "Build updater manifest".
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: MKVBatchMux v${{ steps.manifest.outputs.version }} (build ${{ github.run_number }})
          # Installed apps resolve the manifest through /releases/latest/, which
          # skips prereleases and drafts -- so this must publish as the latest
          # release or no update is ever offered.
          prerelease: false
          draft: false
          make_latest: "true"
          body_path: release-notes.md
          files: artifacts/**

      - name: Verify the published update is reachable
        shell: powershell
        # The manifest has been wrong twice in ways a green build hid: a URL
        # built from the local filename (GitHub rewrites spaces to dots) and a
        # BOM that made it unparseable. Both only surfaced when an installed
        # app tried to update. Fetching what the app fetches catches it here.
        run: |
          $expected = "${{ steps.manifest.outputs.version }}"
          $endpoint = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

          # GitHub's /releases/latest/ pointer lags the release by a few
          # seconds, so an immediate fetch returns the *previous* manifest and
          # the check fails against a build that was actually fine. Poll until
          # the version matches rather than sleeping a guessed interval.
          $manifest = $null
          foreach ($attempt in 1..10) {
            # .Content can come back as a byte array rather than a string, in
            # which case indexing it yields a byte and every field parses as
            # empty. Decode explicitly so the BOM check tests characters.
            $response = Invoke-WebRequest -Uri $endpoint -UseBasicParsing
            $raw = if ($response.Content -is [byte[]]) {
              [System.Text.Encoding]::UTF8.GetString($response.Content)
            } else {
              [string]$response.Content
            }

            if ($raw.Length -gt 0 -and $raw[0] -eq [char]0xFEFF) {
              Write-Error "latest.json starts with a BOM; the updater cannot parse it."
              exit 1
            }

            # Fail loudly on a body that is not the manifest at all, rather
            # than letting ConvertFrom-Json yield empty fields that read as a
            # stale release and burn every retry.
            if ($raw -notmatch '"version"') {
              Write-Host "Attempt ${attempt}: response did not look like the manifest. First 200 chars:"
              Write-Host $raw.Substring(0, [Math]::Min(200, $raw.Length))
              Start-Sleep -Seconds 6
              continue
            }

            $candidate = $raw | ConvertFrom-Json
            if ($candidate.version -eq $expected) { $manifest = $candidate; break }
            Write-Host "Attempt ${attempt}: served version '$($candidate.version)', waiting for '$expected'."
            Start-Sleep -Seconds 6
          }

          if (-not $manifest) {
            Write-Error "The published manifest never advanced to $expected."
            exit 1
          }
          Write-Host "Published version: $($manifest.version)"

          $url = $manifest.platforms.'windows-x86_64'.url
          Write-Host "Update URL: $url"
          $status = (Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing).StatusCode
          if ($status -ne 200) {
            Write-Error "The update download URL returned $status."
            exit 1
          }
          if (-not $manifest.platforms.'windows-x86_64'.signature) {
            Write-Error "The manifest carries no signature; the app would reject this update."
            exit 1
          }
          Write-Host "Update manifest verified: reachable, signed, parseable."
