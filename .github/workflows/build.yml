name: Build installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.setsha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Bump version
        id: bump
        if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          node scripts/bump-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version [skip ci]"
          # Two pushes landing close together race here: the second run's push
          # is rejected because main moved under it, which fails the whole
          # workflow and publishes no release. Rebase and retry instead.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $i); rebasing onto origin/main and retrying."
            git pull --rebase origin main || exit 1
          done
          echo "Could not push the version bump after 3 attempts."
          exit 1
      - name: Set sha output
        id: setsha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci

      - name: Install Windows bundler (WiX)
        if: startsWith(matrix.os, 'windows')
        run: choco install wixtoolset -y

      - name: Build Tauri (Windows MSI + updater)
        if: startsWith(matrix.os, 'windows')
        # The updater bundle is the MSI plus a detached signature. Signing needs
        # the private key: without these secrets the build still succeeds but
        # produces no .sig, and installed apps reject the update.
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        # Space-separated, and --bundles last: as a multi-value flag it would
        # otherwise swallow any argument that followed it. The comma form
        # silently skipped the bundler entirely on 1.6.3, producing a release
        # with a bare .exe and no installer.
        run: npm run tauri:build -- --bundles msi updater

      - name: Inspect bundle output
        shell: powershell
        run: |
          Write-Host "== src-tauri/target/release =="
          Get-ChildItem -Force -ErrorAction SilentlyContinue "src-tauri/target/release"
          Write-Host "== src-tauri/target/release/bundle =="
          Get-ChildItem -Force -ErrorAction SilentlyContinue "src-tauri/target/release/bundle"

      - name: Collect bundles
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($msi) { $msi | Copy-Item -Destination artifacts -Force }
          if ($exe) { $exe | Copy-Item -Destination artifacts -Force }
          # The updater bundle: the archive the app downloads, plus its
          # signature. Searched across the whole bundle tree rather than a
          # fixed subdirectory, since the bundler's layout differs per target.
          $upd = Get-ChildItem -Path "src-tauri/target/release/bundle" -Include "*.msi.zip","*.msi.zip.sig" -Recurse -ErrorAction SilentlyContinue
          if ($upd) { $upd | Copy-Item -Destination artifacts -Force }
          # A bare .exe is not a release. The bundler silently doing nothing
          # previously produced a green build whose release had no installer at
          # all, so the MSI is checked for explicitly rather than accepting
          # whatever happened to land in the directory.
          if (-not $msi) {
            Write-Error "No .msi produced. The bundler did not run -- check the --bundles arguments."
            exit 1
          }
          if (-not $upd) {
            Write-Error "No updater bundle (.msi.zip + .sig) produced, so auto-update would silently break. Check that TAURI_PRIVATE_KEY is set and 'updater' is in --bundles."
            exit 1
          }
          Get-ChildItem -Path artifacts | Select-Object Name, Length | Format-Table

      - name: Build updater manifest
        id: manifest
        shell: powershell
        # latest.json is what an installed app polls. It must carry the version,
        # the download URL and the signature; a manifest without a matching .sig
        # is worse than none, because the app will fetch and then reject it.
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-build.${{ github.run_number }}"
          # Exported so the release step reuses this exact tag. Deriving the
          # same string twice invites a mismatch, and a manifest whose URL
          # points at a tag that was never created is a silent 404 at update
          # time -- the app finds an update it can never download.
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $zip = Get-ChildItem -Path artifacts -Filter "*.msi.zip" | Select-Object -First 1
          $sigFile = Get-ChildItem -Path artifacts -Filter "*.msi.zip.sig" | Select-Object -First 1

          # Collect bundles already fails the build if these are missing, so
          # reaching here without them means that check regressed.
          if (-not $zip -or -not $sigFile) {
            Write-Error "Updater bundle missing after Collect bundles verified it. This should be unreachable."
            exit 1
          }

          $signature = Get-Content $sigFile.FullName -Raw

          # GitHub rewrites spaces in asset names to dots on upload, so the
          # local filename is not the published one. Building the URL from the
          # raw name yields a link that 404s at update time -- the app finds an
          # update it can never download.
          $assetName = $zip.Name -replace ' ', '.'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"

          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated build from commit ${{ github.sha }}."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url       = $url
              }
            }
          }

          # Written without a BOM: PowerShell's -Encoding utf8 emits one on
          # Windows PowerShell, and serde_json rejects a leading BOM, so the
          # updater fails to parse the manifest before it ever sees a version.
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/latest.json"),
            $json,
            (New-Object System.Text.UTF8Encoding $false)
          )
          Write-Host "== latest.json =="
          Get-Content artifacts/latest.json
          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.os }}
          path: artifacts/**
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Same tag the updater manifest points at; see "Build updater manifest".
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: MKV Batch Muxing Tool v${{ steps.manifest.outputs.version }} (build ${{ github.run_number }})
          # Installed apps resolve the manifest through /releases/latest/, which
          # skips prereleases and drafts -- so this must publish as the latest
          # release or no update is ever offered.
          prerelease: false
          draft: false
          make_latest: "true"
          body: |
            Automated build from commit ${{ github.sha }}.
            Artifacts: Windows installer (MSI) and/or portable EXE.

            Installed apps update to this build automatically.
          files: artifacts/**

      - name: Verify the published update is reachable
        shell: powershell
        # The manifest has been wrong twice in ways a green build hid: a URL
        # built from the local filename (GitHub rewrites spaces to dots) and a
        # BOM that made it unparseable. Both only surfaced when an installed
        # app tried to update. Fetching what the app fetches catches it here.
        run: |
          $expected = "${{ steps.manifest.outputs.version }}"
          $endpoint = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

          # GitHub's /releases/latest/ pointer lags the release by a few
          # seconds, so an immediate fetch returns the *previous* manifest and
          # the check fails against a build that was actually fine. Poll until
          # the version matches rather than sleeping a guessed interval.
          $manifest = $null
          foreach ($attempt in 1..10) {
            # .Content can come back as a byte array rather than a string, in
            # which case indexing it yields a byte and every field parses as
            # empty. Decode explicitly so the BOM check tests characters.
            $response = Invoke-WebRequest -Uri $endpoint -UseBasicParsing
            $raw = if ($response.Content -is [byte[]]) {
              [System.Text.Encoding]::UTF8.GetString($response.Content)
            } else {
              [string]$response.Content
            }

            if ($raw.Length -gt 0 -and $raw[0] -eq [char]0xFEFF) {
              Write-Error "latest.json starts with a BOM; the updater cannot parse it."
              exit 1
            }

            # Fail loudly on a body that is not the manifest at all, rather
            # than letting ConvertFrom-Json yield empty fields that read as a
            # stale release and burn every retry.
            if ($raw -notmatch '"version"') {
              Write-Host "Attempt ${attempt}: response did not look like the manifest. First 200 chars:"
              Write-Host $raw.Substring(0, [Math]::Min(200, $raw.Length))
              Start-Sleep -Seconds 6
              continue
            }

            $candidate = $raw | ConvertFrom-Json
            if ($candidate.version -eq $expected) { $manifest = $candidate; break }
            Write-Host "Attempt ${attempt}: served version '$($candidate.version)', waiting for '$expected'."
            Start-Sleep -Seconds 6
          }

          if (-not $manifest) {
            Write-Error "The published manifest never advanced to $expected."
            exit 1
          }
          Write-Host "Published version: $($manifest.version)"

          $url = $manifest.platforms.'windows-x86_64'.url
          Write-Host "Update URL: $url"
          $status = (Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing).StatusCode
          if ($status -ne 200) {
            Write-Error "The update download URL returned $status."
            exit 1
          }
          if (-not $manifest.platforms.'windows-x86_64'.signature) {
            Write-Error "The manifest carries no signature; the app would reject this update."
            exit 1
          }
          Write-Host "Update manifest verified: reachable, signed, parseable."
