<!doctype html>
<!-- `dark` is set here, not in React: the document paints before React mounts,
     so applying it later flashes a white window on launch. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MKVBatchMux</title>
    <meta name="description" content="MKVBatchMux by Ionicboy" />
    <meta name="author" content="Ionicboy" />
    <style>
      /* Matches --base in the dark theme (src/ui/ui.css) so the very first
         frame is the window's own colour. */
      html.dark,
      html.dark body {
        background: #202020;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
